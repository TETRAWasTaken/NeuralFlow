[package]
name = "rensor"
version = "0.1.0"
edition = "2024"
description = "A Rust native deep learning framework specialised for CPU"
license = "Apache-2.0"
authors = ["Anshumaan Soni"]
repository = "https://github.com/TETRAWasTaken/NeuralFlow"
keywords = ["deep-learning", "machine-learning", "neural-networks", "cpu", "fast"]
categories = ["development-tools::profiling", "science"]

[dependencies]
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
mimalloc = { version = "0.1", default-features = false }
rayon = "1.10"
matrixmultiply = "0.3"
onnx-rs = "0.1.2"
xla = { version = "0.1", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[[example]]
name = "csv_mlp"
path = "examples/csv_mlp.rs"

[[example]]
name = "custom_mlp"
path = "examples/custom_mlp.rs"

[[example]]
name = "deepnetwork"
path = "examples/deepnetwork.rs"

[[example]]
name = "CNN"
path = "examples/CNN.rs"

