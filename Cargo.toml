[package]
name = "NeuralFlow"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
mimalloc = { version = "0.1", default-features = false }
rayon = "1.10"
matrixmultiply = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[[example]]
name = "csv_mlp"
path = "examples/csv_mlp.rs"

[[example]]
name = "custom_mlp"
path = "examples/custom_mlp.rs"

[[example]]
name = "deepnetwork"
path = "examples/deepnetwork.rs"
